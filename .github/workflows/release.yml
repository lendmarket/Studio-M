name: Release (Windows)

# package.json의 version을 올려서 main에 push하면, 그 버전의 Windows 설치 파일을 빌드해
# GitHub Releases(v<버전>)에 올립니다. 이미 릴리스된 버전이면 건너뜁니다.
# 설치된 Studio M은 이 Releases를 확인해서 자동으로 업데이트합니다.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if this version is already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v$V 는 이미 릴리스되었습니다. 건너뜁니다."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ver.outputs.skip == 'false'
      - run: npm run build
        if: steps.ver.outputs.skip == 'false'
      - name: Build installer & publish release
        if: steps.ver.outputs.skip == 'false'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
