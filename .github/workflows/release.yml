name: Release (Windows)

# v로 시작하는 태그를 push하면 Windows 설치 파일을 빌드해서 GitHub Releases에 올립니다.
# 설치된 Studio M은 이 Releases를 확인해서 자동으로 업데이트합니다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer & publish release
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
